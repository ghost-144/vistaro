name: Vistaro Catalog Ingestion

on:
  schedule:
    # Runs every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    # Allows you to click "Run workflow" manually from GitHub UI anytime
    inputs:
      movie_pages:
        description: "Movie Pages (20 items/page)"
        required: true
        default: "30"
      tv_pages:
        description: "TV Pages (20 items/page)"
        required: true
        default: "30"
      episodes_for_top:
        description: "Top shows to fetch full seasons for"
        required: true
        default: "50"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 3 hours max execution

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Restore Checkpoint Cache
        uses: actions/cache@v4
        with:
          path: scripts/.ingest_checkpoint.json
          key: ingest-checkpoint-${{ github.run_id }}
          restore-keys: |
            ingest-checkpoint-

      - name: Run Ingestion Job
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: |
          MOVIE_PAGES="${{ github.event.inputs.movie_pages || '25' }}"
          TV_PAGES="${{ github.event.inputs.tv_pages || '25' }}"
          EPISODES="${{ github.event.inputs.episodes_for_top || '50' }}"

          python3 scripts/catalog_ingest.py \
            --movie-pages "$MOVIE_PAGES" \
            --tv-pages "$TV_PAGES" \
            --episodes-for-top "$EPISODES"

      - name: Save Checkpoint Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/.ingest_checkpoint.json
          key: ingest-checkpoint-${{ github.run_id }}
